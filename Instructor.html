<!DOCTYPE html><html><head><base target="_top">
<?!= include('Styles'); ?>
</head><body><div class="wrap">
  <div class="nav">
    <a href="?page=form">Encuesta</a>
    <a href="?page=instructor">Editor de preguntas</a>
    <? if (role === 'admin') { ?><a href="?page=admin">Panel admin</a><? } ?>
    <span class="tag"><?= email ?></span>
  </div>
  <div class="card">
    <h1>Editor de preguntas</h1>
    <p class="sub">Los cambios aplican a partir de ahora — no modifican respuestas ya enviadas.</p>
    <div id="msg"></div>
    <div class="card" style="padding:16px;">
      <h2>Áreas del selector</h2>
      <div id="areasLista">Cargando...</div>
      <div style="margin-top:10px;display:flex;gap:8px;">
        <input type="text" id="nuevaArea" placeholder="Nueva área" style="margin-bottom:0;">
        <button onclick="agregarArea()">Agregar</button>
      </div>
    </div>
    <div id="lista">Cargando...</div>
    <button onclick="nueva()">+ Agregar pregunta</button>
  </div>
</div>
<script>
  var preguntas = [];
  cargar();
  cargarAreas();
  function cargarAreas(){
    google.script.run.withSuccessHandler(function(areas){
      document.getElementById('areasLista').innerHTML = areas.map(function(a){
        return '<div class="opt" style="justify-content:space-between;"><span>' + a + '</span>' +
          '<button class="danger" onclick="quitarArea(\'' + a + '\')">Quitar</button></div>';
      }).join('');
    }).getAreas();
  }
  function agregarArea(){
    var v = document.getElementById('nuevaArea').value.trim();
    if (!v) return;
    google.script.run.withSuccessHandler(function(r){
      if (r.ok) { document.getElementById('nuevaArea').value = ''; cargarAreas(); }
      else { msg(r.error, 'err'); }
    }).guardarArea(v);
  }
  function quitarArea(a){
    if (!confirm('¿Quitar el área "' + a + '"?')) return;
    google.script.run.withSuccessHandler(function(){ cargarAreas(); }).eliminarArea(a);
  }
  function cargar(){
    google.script.run.withSuccessHandler(function(data){ preguntas = data; render(); }).getPreguntasPublicas();
  }
  function render(){
    document.getElementById('lista').innerHTML = preguntas.map(function(p,i){
      return '<div class="card" style="padding:16px;">' +
        '<label>Sección</label><input type="text" value="' + p.seccion + '" onchange="upd(' + i + ',\'seccion\',this.value)">' +
        '<label>Texto de la pregunta</label><textarea rows="2" onchange="upd(' + i + ',\'texto\',this.value)">' + p.texto + '</textarea>' +
        '<label>Tipo</label><select onchange="upd(' + i + ',\'tipo\',this.value)">' +
          '<option value="radio" ' + (p.tipo==='radio'?'selected':'') + '>Selección única</option>' +
          '<option value="checkbox" ' + (p.tipo==='checkbox'?'selected':'') + '>Selección múltiple</option>' +
        '</select>' +
        '<label>Opciones (una por línea)</label><textarea rows="4" onchange="updOpciones(' + i + ',this.value)">' + p.opciones.join('\\n') + '</textarea>' +
        '<label><input type="checkbox" ' + (p.requerido?'checked':'') + ' onchange="upd(' + i + ',\'requerido\',this.checked)" style="width:auto;display:inline;"> Obligatoria</label>' +
        '<label><input type="checkbox" ' + (p.otro?'checked':'') + ' onchange="upd(' + i + ',\'otro\',this.checked)" style="width:auto;display:inline;"> Incluir opción "Otra"</label>' +
        '<div style="margin-top:10px;"><button onclick="guardar(' + i + ')">Guardar</button> ' +
        '<button class="danger" onclick="eliminar(\'' + p.id + '\')">Eliminar</button></div>' +
      '</div>';
    }).join('');
  }
  function upd(i, campo, val){ preguntas[i][campo] = val; }
  function updOpciones(i, val){ preguntas[i].opciones = val.split('\\n').map(function(s){return s.trim();}).filter(Boolean); }
  function guardar(i){
    google.script.run.withSuccessHandler(function(){ msg('Pregunta guardada.', 'ok'); }).withFailureHandler(function(e){ msg(e.message,'err'); }).guardarPregunta(preguntas[i]);
  }
  function eliminar(id){
    if (!confirm('¿Eliminar esta pregunta?')) return;
    google.script.run.withSuccessHandler(function(){ cargar(); }).eliminarPregunta(id);
  }
  function nueva(){
    var nid = 'q' + (Date.now());
    preguntas.push({ id: nid, seccion: 'Nueva sección', orden: preguntas.length+1, texto: 'Nueva pregunta', tipo: 'radio', opciones: ['Opción 1','Opción 2'], requerido: true, otro: false });
    render();
  }
  function msg(t, cls){ document.getElementById('msg').innerHTML = '<div class="msg ' + cls + '">' + t + '</div>'; }
</script>
</body></html>
