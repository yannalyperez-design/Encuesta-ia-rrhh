<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#F4F7FB;color:#001E62;margin:0;padding:24px;}
  .wrap{max-width:680px;margin:0 auto;}
  .nav{display:flex;gap:16px;margin-bottom:20px;font-size:13px;flex-wrap:wrap;}
  .nav a{color:#418FDE;text-decoration:none;font-weight:600;}
  .nav span.tag{background:#EFFAF9;color:#00786F;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;}
  .card{background:#fff;border:1px solid #DCE4F0;border-radius:14px;padding:26px;margin-bottom:20px;box-shadow:0 8px 24px rgba(0,30,98,.06);}
  h1{font-size:22px;margin:0 0 6px;}
  h2{font-size:16px;margin:0 0 14px;}
  p.sub{color:#65708A;font-size:13.5px;margin:0 0 20px;}
  label{display:block;font-weight:600;font-size:13.5px;margin-bottom:8px;}
  input[type=text],input[type=email],select,textarea{width:100%;border:none;border-bottom:2px solid #DCE4F0;padding:8px 2px;font-family:inherit;font-size:14.5px;background:transparent;margin-bottom:16px;box-sizing:border-box;}
  .opt{display:flex;gap:10px;align-items:center;border:1px solid #DCE4F0;border-radius:9px;padding:10px 12px;margin-bottom:6px;cursor:pointer;}
  .opt.sel{border-color:#00A19A;background:#EFFAF9;}
  button{font-family:inherit;font-weight:600;font-size:13.5px;border:none;border-radius:9px;padding:9px 16px;cursor:pointer;background:#00A19A;color:#fff;}
  button.secondary{background:none;color:#65708A;}
  button.danger{background:#E50571;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table th,table td{text-align:left;padding:7px 6px;border-bottom:1px solid #DCE4F0;vertical-align:top;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .bar-row .name{width:42%;font-size:12px;color:#65708A;}
  .bar-track{flex:1;height:8px;background:#F4F7FB;border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:#418FDE;}
  .bar-row .pct{width:36px;text-align:right;font-size:12px;font-weight:600;}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
  .msg.ok{background:#EFFAF9;color:#00786F;}
  .msg.err{background:#FDEAF2;color:#B8034F;}
  .tabbtn{background:none;border:none;font-family:inherit;font-weight:600;font-size:13.5px;color:#65708A;padding:8px 4px;margin-right:18px;cursor:pointer;border-bottom:2px solid transparent;}
  .tabbtn.active{color:#001E62;border-color:#00A19A;}
  .stat{font-size:34px;font-weight:800;}
</style>
