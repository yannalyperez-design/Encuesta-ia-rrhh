<!DOCTYPE html><html><head><base target="_top">
<?!= include('Styles'); ?>
</head><body><div class="wrap">
  <div class="nav">
    <a href="?page=form">Encuesta</a>
    <? if (role === 'admin' || role === 'instructor') { ?><a href="?page=instructor">Editor de preguntas</a><? } ?>
    <? if (role === 'admin') { ?><a href="?page=admin">Panel admin</a><? } ?>
    <span class="tag"><?= email ?></span>
  </div>
  <div class="card">
    <h1>Encuesta de adopción de IA</h1>
    <p class="sub">Queremos entender cómo estamos usando la IA en el equipo. Responde con honestidad, te tomará unos minutos.</p>
    <div id="msg"></div>
    <div id="personal">
      <label>Nombre*</label><input type="text" id="nombre">
      <label>Apellido*</label><input type="text" id="apellido">
      <label>Área*</label>
      <select id="area"><option value="">Selecciona...</option></select>
      <label>País*</label>
      <select id="pais">
        <option value="">Selecciona...</option>
        <option>Venezuela</option>
        <option>Colombia</option>
        <option>Argentina</option>
      </select>
      <label>Cédula*</label><input type="text" id="cedula">
    </div>
    <div id="preguntas">Cargando preguntas...</div>
    <button id="btnEnviar" onclick="enviar()">Enviar encuesta</button>
  </div>
</div>
<script>
  var preguntas = [];
  var respuestas = {};
  var otroTexto = {};

  google.script.run.withSuccessHandler(function(data){
    preguntas = data;
    render();
  }).getPreguntasPublicas();

  google.script.run.withSuccessHandler(function(areas){
    var sel = document.getElementById('area');
    areas.forEach(function(a){
      var opt = document.createElement('option');
      opt.textContent = a; opt.value = a;
      sel.appendChild(opt);
    });
  }).getAreas();

  function render(){
    var secciones = {};
    preguntas.forEach(function(p){ (secciones[p.seccion] = secciones[p.seccion] || []).push(p); });
    var html = '';
    Object.keys(secciones).forEach(function(sec){
      html += '<h2 style="margin-top:22px;">' + sec + '</h2>';
      secciones[sec].forEach(function(p){ html += renderField(p); });
    });
    document.getElementById('preguntas').innerHTML = html;
  }

  function renderField(p){
    var inner = '';
    if (p.tipo === 'radio'){
      p.opciones.forEach(function(o){
        var sel = respuestas[p.id] === o;
        inner += '<div class="opt ' + (sel?'sel':'') + '" onclick="setRadio(\'' + p.id + '\',\'' + esc(o) + '\')">' +
          '<input type="radio" ' + (sel?'checked':'') + ' readonly><span>' + o + '</span></div>';
      });
    } else if (p.tipo === 'checkbox'){
      var arr = respuestas[p.id] || [];
      p.opciones.forEach(function(o){
        var sel = arr.indexOf(o) !== -1;
        inner += '<div class="opt ' + (sel?'sel':'') + '" onclick="toggleCheck(\'' + p.id + '\',\'' + esc(o) + '\')">' +
          '<input type="checkbox" ' + (sel?'checked':'') + ' readonly><span>' + o + '</span></div>';
      });
      if (p.otro){
        var otroSel = arr.indexOf('Otra') !== -1;
        inner += '<div class="opt ' + (otroSel?'sel':'') + '" onclick="toggleCheck(\'' + p.id + '\',\'Otra\')">' +
          '<input type="checkbox" ' + (otroSel?'checked':'') + ' readonly><span>Otra</span></div>';
        if (otroSel) inner += '<input type="text" placeholder="Especifica..." value="' + (otroTexto[p.id]||'') + '" oninput="otroTexto[\'' + p.id + '\']=this.value">';
      }
    }
    return '<div style="margin-bottom:18px;"><label>' + p.texto + (p.requerido?' *':'') + '</label>' + inner + '</div>';
  }

  function esc(s){ return s.replace(/'/g, "\\'"); }
  function setRadio(id, val){ respuestas[id] = val; render(); }
  function toggleCheck(id, val){
    var arr = respuestas[id] ? respuestas[id].slice() : [];
    var i = arr.indexOf(val);
    if (i === -1) arr.push(val); else arr.splice(i,1);
    respuestas[id] = arr;
    render();
  }

  function enviar(){
    var nombre = document.getElementById('nombre').value.trim();
    var apellido = document.getElementById('apellido').value.trim();
    var area = document.getElementById('area').value;
    var pais = document.getElementById('pais').value;
    var cedula = document.getElementById('cedula').value.trim();
    if (!nombre || !apellido || !area || !pais || !cedula){
      msg('Completa tus datos personales antes de continuar.', 'err'); return;
    }
    for (var i=0;i<preguntas.length;i++){
      var p = preguntas[i];
      if (p.requerido){
        var v = respuestas[p.id];
        if (p.tipo === 'checkbox' && (!v || v.length===0)){ msg('Falta responder: ' + p.texto, 'err'); return; }
        if (p.tipo === 'radio' && !v){ msg('Falta responder: ' + p.texto, 'err'); return; }
      }
    }
    var finalRespuestas = {};
    Object.keys(respuestas).forEach(function(id){
      var v = respuestas[id];
      if (Array.isArray(v) && v.indexOf('Otra') !== -1 && otroTexto[id]){
        v = v.map(function(x){ return x==='Otra' ? ('Otra: ' + otroTexto[id]) : x; });
      }
      finalRespuestas[id] = v;
    });
    document.getElementById('btnEnviar').disabled = true;
    google.script.run.withSuccessHandler(function(){
      document.querySelector('.card').innerHTML = '<h1>¡Gracias por responder!</h1><p class="sub">Tu respuesta quedó registrada.</p>';
    }).withFailureHandler(function(err){
      msg('No se pudo guardar: ' + err.message, 'err');
      document.getElementById('btnEnviar').disabled = false;
    }).guardarRespuesta({ nombre: nombre, apellido: apellido, area: area, pais: pais, cedula: cedula, respuestas: finalRespuestas });
  }

  function msg(t, cls){ document.getElementById('msg').innerHTML = '<div class="msg ' + cls + '">' + t + '</div>'; }
</script>
</body></html>
