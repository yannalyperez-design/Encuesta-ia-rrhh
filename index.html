<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encuesta de adopción de IA — Farmatodo</title>
<meta http-equiv="refresh" content="2;url=https://script.google.com/a/macros/farmatodo.com/s/AKfycbwyoSmK-qoPzwX_oqOYu58mi64QKi8mfi3u6WcB50I4DqwOqFRrfBFHkIzn3eh-0ETW/exec">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
  :root{
    --navy:#001E62; --blue:#418FDE; --teal:#00A19A; --magenta:#E50571;
    --bg:#F4F7FB; --border:#DCE4F0; --muted:#65708A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Montserrat',Arial,sans-serif; background:var(--bg); color:var(--navy);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    max-width:420px; width:100%; text-align:center; background:#fff;
    border:1px solid var(--border); border-radius:16px; padding:40px 32px;
    box-shadow:0 12px 34px rgba(0,30,98,.08);
  }
  .brand{font-size:12.5px; font-weight:700; letter-spacing:.03em; color:var(--blue); margin-bottom:22px;}
  .spinner{
    width:40px; height:40px; margin:0 auto 22px; border-radius:50%;
    border:4px solid var(--border); border-top-color:var(--teal);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1{font-size:19px; font-weight:800; margin:0 0 8px; line-height:1.35;}
  p{font-size:13.5px; color:var(--muted); margin:0 0 26px; line-height:1.55;}
  a.btn{
    display:inline-block; background:var(--teal); color:#fff; text-decoration:none;
    font-weight:600; font-size:14px; padding:12px 22px; border-radius:9px;
  }
  a.btn:hover{opacity:.9;}
  .fallback{font-size:12px; color:var(--muted); margin-top:18px;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">FARMATODO · CENCAP</div>
    <div class="spinner"></div>
    <h1>Encuesta de adopción de IA</h1>
    <p>Te estamos llevando a la encuesta, un momento por favor...</p>
    <a class="btn" href="https://script.google.com/a/macros/farmatodo.com/s/AKfycbwyoSmK-qoPzwX_oqOYu58mi64QKi8mfi3u6WcB50I4DqwOqFRrfBFHkIzn3eh-0ETW/exec">
      Ir a la encuesta ahora
    </a>
    <div class="fallback">Si no te redirige automáticamente en unos segundos, usa el botón de arriba.</div>
  </div>
  <script>
    setTimeout(function(){
      window.location.href = "https://script.google.com/a/macros/farmatodo.com/s/AKfycbwyoSmK-qoPzwX_oqOYu58mi64QKi8mfi3u6WcB50I4DqwOqFRrfBFHkIzn3eh-0ETW/exec";
    }, 800);
  </script>
</body>
</html>
